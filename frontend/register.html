<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — SimpleTech</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h1>Create Account</h1>
      <p class="subtitle">Sign Up for free</p>

        <!-- ✅ CHANGED: Added error message container -->
      <div id="errorMsg" class="error-msg hidden"></div>

      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name" required />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="At least 8 characters"
          required
          autocomplete="new-password"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm Password"
          required
          autocomplete="new-password"
        />
      </div>

      <!-- ✅ CHANGED: type="button" with id="registerBtn" instead of form submit -->
      <button type="button" id="registerBtn" class="btn">Create Account</button>

      <p class="login-link">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>

    <!-- ✅ CHANGED: auth.js loads first, then register.js -->
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
